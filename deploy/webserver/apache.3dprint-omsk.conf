# ========================================
# Apache Configuration for 3dprint-omsk.ru
# Hardened configuration with SSL, security headers, and performance optimizations
# ========================================
#
# Installation:
# 1. Copy this file to /etc/apache2/sites-available/3dprint-omsk.conf
# 2. Enable site: sudo a2ensite 3dprint-omsk.conf
# 3. Enable required modules: sudo a2enmod rewrite ssl headers expires deflate http2
# 4. Test configuration: sudo apachectl configtest
# 5. Reload Apache: sudo systemctl reload apache2
#
# Prerequisites:
# - PHP 7.4+ installed (mod_php or PHP-FPM)
# - SSL certificates obtained (see docs/WEB_SERVER_CONFIG.md for Let's Encrypt setup)
# - Project files deployed to /var/www/3dprint-omsk.ru
# ========================================

# ========================================
# HTTP → HTTPS Redirect (Port 80)
# ========================================
<VirtualHost *:80>
    ServerName 3dprint-omsk.ru
    ServerAlias www.3dprint-omsk.ru

    # Redirect all HTTP traffic to HTTPS apex domain
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =www.3dprint-omsk.ru [OR]
    RewriteCond %{SERVER_NAME} =3dprint-omsk.ru
    RewriteRule ^ https://3dprint-omsk.ru%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# ========================================
# HTTPS → Apex Domain (www removal)
# ========================================
<VirtualHost *:443>
    ServerName www.3dprint-omsk.ru

    # SSL Certificate Configuration
    # CUSTOMIZE: Update these paths after running certbot
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/3dprint-omsk.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/3dprint-omsk.ru/privkey.pem

    # Redirect www to apex domain
    RewriteEngine On
    RewriteRule ^ https://3dprint-omsk.ru%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# ========================================
# Main HTTPS Server (apex domain)
# ========================================
<VirtualHost *:443>
    ServerName 3dprint-omsk.ru
    ServerAdmin admin@3dprint-omsk.ru

    # CUSTOMIZE: Update this path to your project root
    DocumentRoot /var/www/3dprint-omsk.ru

    # Access and error logs
    # CUSTOMIZE: Adjust log paths if needed
    ErrorLog ${APACHE_LOG_DIR}/3dprint-omsk.ru.error.log
    CustomLog ${APACHE_LOG_DIR}/3dprint-omsk.ru.access.log combined

    # ========================================
    # SSL Configuration
    # ========================================
    SSLEngine on
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off

    # CUSTOMIZE: Update these paths after running certbot
    SSLCertificateFile /etc/letsencrypt/live/3dprint-omsk.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/3dprint-omsk.ru/privkey.pem

    # OCSP Stapling
    SSLUseStapling on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    # HTTP/2 Support
    Protocols h2 http/1.1

    # ========================================
    # Security Headers
    # ========================================
    # Prevent MIME type sniffing
    Header always set X-Content-Type-Options "nosniff"

    # Prevent clickjacking attacks
    Header always set X-Frame-Options "DENY"

    # Enable XSS protection in legacy browsers
    Header always set X-XSS-Protection "1; mode=block"

    # Referrer policy - strict by default
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Permissions Policy - disable unnecessary browser features
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

    # HSTS (HTTP Strict Transport Security)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy - Public context
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://mc.yandex.ru; frame-src https://www.youtube.com https://yandex.ru; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

    # Hide Apache version
    ServerTokens Prod
    ServerSignature Off

    # ========================================
    # Directory Configuration
    # ========================================
    <Directory /var/www/3dprint-omsk.ru>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted

        # Enable Rewrite Engine
        RewriteEngine On

        # ========================================
        # Block Access to Sensitive Files
        # ========================================
        # Deny access to hidden files (starting with .)
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>

        # Deny access to sensitive extensions
        <FilesMatch "\.(git|env|htaccess|htpasswd|sql|backup|bak|log|old|orig|save|swo|swp)$">
            Require all denied
        </FilesMatch>

        # Deny access to composer files
        <FilesMatch "^(composer\.(json|lock)|package(-lock)?\.json)$">
            Require all denied
        </FilesMatch>

        # ========================================
        # API Routing
        # ========================================
        # Ensure API PHP files are processed
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} ^/api/
        RewriteRule ^ - [L,R=404]

        # ========================================
        # Admin Panel Routing
        # ========================================
        # Ensure admin PHP files are processed
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} ^/admin/
        RewriteRule ^ - [L,R=404]
    </Directory>

    # ========================================
    # Deny Access to Sensitive Directories
    # ========================================
    <DirectoryMatch "^/var/www/3dprint-omsk.ru/(storage|database|scripts|bootstrap|app|vendor|tests|docs|logs|\.git)">
        Require all denied
    </DirectoryMatch>

    # Allow access to uploaded media files
    <Directory /var/www/3dprint-omsk.ru/storage/uploads>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=2592000"
    </Directory>

    # ========================================
    # PHP Configuration
    # ========================================
    # 5MB upload limit (aligned with MediaUploadService)
    php_value upload_max_filesize 5M
    php_value post_max_size 5M
    php_value max_execution_time 180
    php_value max_input_time 60
    php_value memory_limit 256M

    # ========================================
    # SSE (Server-Sent Events) Configuration
    # ========================================
    <Location /api/updates/stream.php>
        # Disable buffering for SSE
        Header set Content-Type "text/event-stream"
        Header set Cache-Control "no-cache"
        Header set X-Accel-Buffering "no"
        
        # Extended timeout for SSE
        php_value max_execution_time 3600
    </Location>

    # ========================================
    # Compression (mod_deflate)
    # ========================================
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE text/javascript
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/json
        AddOutputFilterByType DEFLATE font/truetype
        AddOutputFilterByType DEFLATE font/opentype
        AddOutputFilterByType DEFLATE application/vnd.ms-fontobject
        AddOutputFilterByType DEFLATE image/svg+xml

        # Exclude old browsers from compression
        BrowserMatch ^Mozilla/4 gzip-only-text/html
        BrowserMatch ^Mozilla/4\.0[678] no-gzip
        BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
    </IfModule>

    # ========================================
    # Browser Caching (mod_expires)
    # ========================================
    <IfModule mod_expires.c>
        ExpiresActive On

        # Images
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"

        # Fonts
        ExpiresByType font/ttf "access plus 1 year"
        ExpiresByType font/otf "access plus 1 year"
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType application/font-woff "access plus 1 year"
        ExpiresByType application/vnd.ms-fontobject "access plus 1 year"

        # CSS and JavaScript
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType text/javascript "access plus 1 week"

        # HTML documents
        ExpiresByType text/html "access plus 0 seconds"

        # Default
        ExpiresDefault "access plus 1 month"
    </IfModule>

    # ========================================
    # Cache-Control Headers (mod_headers)
    # ========================================
    <IfModule mod_headers.c>
        # Static assets - long-term caching
        <FilesMatch "\.(jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|otf|eot)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>

        # CSS and JavaScript - medium-term caching
        <FilesMatch "\.(css|js)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>

        # HTML documents - no caching
        <FilesMatch "\.(html|htm)$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </FilesMatch>

        # Remove ETags (we use Last-Modified)
        Header unset ETag
    </IfModule>

    FileETag None
</VirtualHost>

# ========================================
# OCSP Stapling Cache (global)
# ========================================
<IfModule mod_ssl.c>
    SSLStaplingCache shmcb:/var/run/ocsp(128000)
</IfModule>
