# ========================================
# Nginx Configuration for 3dprint-omsk.ru
# Hardened configuration with SSL, security headers, and performance optimizations
# ========================================
#
# Installation:
# 1. Copy this file to /etc/nginx/sites-available/3dprint-omsk.conf
# 2. Create symlink: sudo ln -s /etc/nginx/sites-available/3dprint-omsk.conf /etc/nginx/sites-enabled/
# 3. Test configuration: sudo nginx -t
# 4. Reload Nginx: sudo systemctl reload nginx
#
# Prerequisites:
# - PHP-FPM 7.4+ installed and running (usually at /run/php/php7.4-fpm.sock or php8.1-fpm.sock)
# - SSL certificates obtained (see docs/WEB_SERVER_CONFIG.md for Let's Encrypt setup)
# - Project files deployed to /var/www/3dprint-omsk.ru
# ========================================

# ========================================
# Upstream PHP-FPM Configuration
# ========================================
upstream php_fpm {
    # Change socket path to match your PHP-FPM version
    # Common paths:
    # - Ubuntu/Debian PHP 7.4: /run/php/php7.4-fpm.sock
    # - Ubuntu/Debian PHP 8.1: /run/php/php8.1-fpm.sock
    # - Ubuntu/Debian PHP 8.2: /run/php/php8.2-fpm.sock
    # - CentOS/RHEL: /var/run/php-fpm/www.sock
    server unix:/run/php/php7.4-fpm.sock;
}

# ========================================
# HTTP → HTTPS Redirect (apex domain)
# ========================================
server {
    listen 80;
    listen [::]:80;
    server_name 3dprint-omsk.ru;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# ========================================
# HTTP → HTTPS Redirect (www subdomain)
# ========================================
server {
    listen 80;
    listen [::]:80;
    server_name www.3dprint-omsk.ru;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://3dprint-omsk.ru$request_uri;
}

# ========================================
# HTTPS → Apex Domain Redirect (www removal)
# ========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.3dprint-omsk.ru;

    # SSL Certificate Configuration
    # CUSTOMIZE: Update these paths after running certbot
    ssl_certificate /etc/letsencrypt/live/3dprint-omsk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dprint-omsk.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/3dprint-omsk.ru/chain.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Redirect www to apex domain
    return 301 https://3dprint-omsk.ru$request_uri;
}

# ========================================
# Main HTTPS Server Block (apex domain)
# ========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3dprint-omsk.ru;

    # CUSTOMIZE: Update this path to your project root
    root /var/www/3dprint-omsk.ru;
    index index.html index.php;

    charset utf-8;

    # Access and error logs
    # CUSTOMIZE: Adjust log paths if needed
    access_log /var/log/nginx/3dprint-omsk.ru.access.log;
    error_log /var/log/nginx/3dprint-omsk.ru.error.log warn;

    # ========================================
    # SSL Certificate Configuration
    # ========================================
    # CUSTOMIZE: Update these paths after running certbot
    ssl_certificate /etc/letsencrypt/live/3dprint-omsk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dprint-omsk.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/3dprint-omsk.ru/chain.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ========================================
    # Security Headers
    # ========================================
    include /etc/nginx/snippets/3dprint-security.conf;

    # ========================================
    # Client Request Limits
    # ========================================
    # 5MB upload limit (aligned with MediaUploadService)
    client_max_body_size 5M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Request timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # ========================================
    # Gzip Compression
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    gzip_min_length 256;

    # ========================================
    # Brotli Compression (if module available)
    # ========================================
    # Uncomment if nginx-module-brotli is installed
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ========================================
    # Static Asset Caching
    # ========================================
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location ~* \.(css|js)$ {
        expires 1w;
        add_header Cache-Control "public";
        access_log off;
    }

    # ========================================
    # Uploaded Media Files
    # ========================================
    location ^~ /storage/uploads/ {
        # Allow public access to uploaded files
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }

    # ========================================
    # Deny Access to Sensitive Directories
    # ========================================
    location ^~ /storage/ {
        # Deny access to storage root (except uploads handled above)
        deny all;
    }

    location ^~ /database/ {
        deny all;
    }

    location ^~ /scripts/ {
        deny all;
    }

    location ^~ /bootstrap/ {
        deny all;
    }

    location ^~ /app/ {
        deny all;
    }

    location ^~ /vendor/ {
        deny all;
    }

    location ^~ /tests/ {
        deny all;
    }

    location ^~ /docs/ {
        deny all;
    }

    location ^~ /logs/ {
        deny all;
    }

    location ^~ /.git/ {
        deny all;
    }

    # ========================================
    # SSE (Server-Sent Events) Endpoint
    # ========================================
    location = /api/updates/stream.php {
        # Disable buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;

        # Pass to PHP-FPM
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # SSE-specific headers
        fastcgi_buffering off;
        fastcgi_read_timeout 3600s;
        add_header Content-Type "text/event-stream";
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # ========================================
    # API Endpoints (PHP-FPM)
    # ========================================
    location ^~ /api/ {
        # Try file first, then pass to PHP
        try_files $uri $uri/ =404;

        # PHP file handling
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS on;

            # PHP execution timeouts
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 180s;
            fastcgi_read_timeout 180s;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
        }
    }

    # ========================================
    # Admin Panel (PHP-FPM)
    # ========================================
    location ^~ /admin/ {
        # Try file first, then pass to PHP
        try_files $uri $uri/ =404;

        # PHP file handling
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS on;

            # PHP execution timeouts
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 180s;
            fastcgi_read_timeout 180s;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
        }
    }

    # ========================================
    # Root PHP Files
    # ========================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;

        # PHP execution timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # ========================================
    # Default Location (Static HTML)
    # ========================================
    location / {
        try_files $uri $uri/ =404;
    }

    # ========================================
    # Error Pages
    # ========================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
