# ========================================
# Security Headers Snippet for Nginx
# Include this in server blocks for hardened security
# ========================================

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking attacks
add_header X-Frame-Options "DENY" always;

# Enable XSS protection in legacy browsers
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy - strict by default
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy - disable unnecessary browser features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# HSTS (HTTP Strict Transport Security)
# Enforce HTTPS for 1 year including subdomains
# Only add this header over HTTPS connections
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy - Public context
# Customize this based on your needs (admin/public/api contexts)
# For admin panel, adjust script-src and style-src accordingly
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://mc.yandex.ru; frame-src https://www.youtube.com https://yandex.ru; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# Hide Nginx version
server_tokens off;

# Prevent access to sensitive files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ \.(git|env|htaccess|htpasswd|sql|backup|bak|log|old|orig|save|swo|swp)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny access to composer files
location ~ ^/(composer\.(json|lock)|package(-lock)?\.json)$ {
    deny all;
    access_log off;
    log_not_found off;
}
