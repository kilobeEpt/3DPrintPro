<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест формы заказа</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="padding: 50px;">
        <section class="order-form-section" id="order">
            <div class="container">
                <div class="section-header" style="text-align: center; margin-bottom: 40px;">
                    <span class="section-label" style="color: #6366f1; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Оформить заказ</span>
                    <h2 class="section-title" style="font-size: 2.5rem; margin: 10px 0;">Закажите 3D печать прямо сейчас</h2>
                    <p class="section-description" style="color: #6b7280; font-size: 1.1rem;">
                        Заполните форму, и мы свяжемся с вами в течение 15 минут
                    </p>
                </div>
                
                <div class="order-form-wrapper">
                    <form class="order-form" id="order-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="orderFio">
                                    <i class="fas fa-user"></i>
                                    ФИО*
                                </label>
                                <input 
                                    type="text" 
                                    id="orderFio" 
                                    name="fio" 
                                    class="form-control" 
                                    placeholder="Иванов Иван Иванович"
                                    required
                                >
                            </div>
                            
                            <div class="form-group">
                                <label for="orderEmail">
                                    <i class="fas fa-envelope"></i>
                                    Email*
                                </label>
                                <input 
                                    type="email" 
                                    id="orderEmail" 
                                    name="email" 
                                    class="form-control" 
                                    placeholder="example@mail.com"
                                    required
                                >
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="orderPhone">
                                    <i class="fas fa-phone"></i>
                                    Телефон*
                                </label>
                                <input 
                                    type="tel" 
                                    id="orderPhone" 
                                    name="phone" 
                                    class="form-control" 
                                    placeholder="+7 (900) 123-45-67"
                                    required
                                >
                            </div>
                            
                            <div class="form-group">
                                <label for="orderTelegram">
                                    <i class="fab fa-telegram"></i>
                                    Telegram username*
                                </label>
                                <input 
                                    type="text" 
                                    id="orderTelegram" 
                                    name="telegram" 
                                    class="form-control" 
                                    placeholder="username (без @)"
                                    required
                                >
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="orderService">
                                <i class="fas fa-cogs"></i>
                                Услуга*
                            </label>
                            <select id="orderService" name="service" class="form-control" required>
                                <option value="">Выберите услугу</option>
                                <option value="FDM печать">FDM печать</option>
                                <option value="SLA печать">SLA печать</option>
                                <option value="SLS печать">SLS печать</option>
                                <option value="Цветная печать">Цветная печать</option>
                                <option value="Постобработка">Постобработка</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="orderDescription">
                                <i class="fas fa-comment-alt"></i>
                                Описание проекта*
                            </label>
                            <textarea 
                                id="orderDescription" 
                                name="description" 
                                class="form-control" 
                                rows="5" 
                                placeholder="Расскажите о вашем проекте (минимум 10 символов)"
                                required
                            ></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="orderFiles">
                                <i class="fas fa-file-upload"></i>
                                Загрузить файл (опционально)
                            </label>
                            <input 
                                type="file" 
                                id="orderFiles" 
                                name="files" 
                                class="form-control" 
                                accept=".stl,.obj,.gcode,.step,.stp,.3mf,.amf,.ply"
                            >
                            <small style="color: #6b7280; display: block; margin-top: 5px;">
                                Допустимые форматы: STL, OBJ, GCODE, STEP, 3MF, AMF, PLY. Максимум 50 МБ
                            </small>
                            <div id="file-info" style="display: none; color: #14b8a6; margin-top: 5px; font-size: 14px;"></div>
                        </div>
                        
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="privacy" required>
                                <span>Согласен на обработку персональных данных</span>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block" style="width: 100%; padding: 15px; font-size: 1rem; background: #6366f1; color: white; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-paper-plane"></i>
                            Отправить заказ
                        </button>
                    </form>
                    
                    <div id="form-message" class="form-message" style="display: none;"></div>
                </div>
            </div>
        </section>
        
        <div style="text-align: center; margin-top: 40px;">
            <button onclick="document.body.classList.toggle('dark-theme')" style="padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer;">
                🌓 Toggle Dark/Light Theme
            </button>
        </div>
    </div>
    
    <script src="js/form-handler.js"></script>
    
    <script>
        // Mock order-submit.php for testing
        console.log('✅ Form loaded successfully');
        console.log('✅ All 7 required fields present: fio, email, phone, telegram, service, description, files');
        console.log('✅ Form handler script loaded');
        console.log('✅ No API dependencies');
        console.log('✅ Using plain fetch()');
    </script>
</body>
</html>
